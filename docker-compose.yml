version: '3.8'

services:
  sidelight:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      # 挂载本地目录用于处理照片
      - "./data:/app/data"
      # 挂载配置目录
      - "./config:/app/config"
    environment:
      # RawTherapee CLI 路径（Linux 下的路径）
      - RT_CLI_PATH=/usr/bin/rawtherapee-cli
      # Gemini API 配置（可选，优先使用 config.json）
      - SL_GEMINI_API_KEY=${SL_GEMINI_API_KEY:-}
      - SL_GEMINI_ENDPOINT_URL=${SL_GEMINI_ENDPOINT_URL:-}
      - SL_GEMINI_MODEL_NAME=${SL_GEMINI_MODEL_NAME:-gemini-pro-vision}
    # 启动 web server 模式
    command: ["server", "--port", "8080"]
    restart: unless-stopped

  # 单次处理服务（示例）
  sidelight-cli:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - "./data:/app/data"
      - "./config:/app/config"
    environment:
      # RawTherapee CLI 路径
      - RT_CLI_PATH=/usr/bin/rawtherapee-cli
      # Gemini API 配置（优先使用 config.json）
      - SL_GEMINI_API_KEY=${SL_GEMINI_API_KEY:-}
    # 默认命令可以通过 docker-compose run 覆盖
    command: ["--help"]
    profiles:
      - cli